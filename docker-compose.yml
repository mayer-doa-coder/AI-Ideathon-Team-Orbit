services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agrisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agrisense
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agrisense"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: agrisense-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/agrisense
    ports:
      - "8000:8000"
    volumes:
      # synthesize_speech() writes .wav files here and app.main mounts the
      # directory as StaticFiles, so it has to outlive the container.
      - generated_audio:/app/generated_audio
    # python:3.13-slim ships neither curl nor wget, so probe the root route
    # (app.main's `/`) with the stdlib instead of adding a package for it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      # alembic upgrade head runs before uvicorn binds (docker-entrypoint.sh),
      # so allow for migrations on a cold database before counting failures.
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: agrisense-frontend
    restart: unless-stopped
    environment:
      # Read by the browser, not the container, so this is the host-published
      # port rather than the `backend` service name.
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  generated_audio:

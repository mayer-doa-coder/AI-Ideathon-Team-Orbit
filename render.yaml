# Render Blueprint for Green Leaf AI.
# Deploys the FastAPI backend as a native Python web service and the Vite/React
# frontend as a static site. This does NOT use the project's Dockerfiles —
# Render builds/runs both services directly from source.
#
# Usage: push this file to the repo root, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo. See README/manual steps
# for the env vars you must fill in by hand (secrets are never stored here).

databases:
  - name: agrisense-postgres
    databaseName: agrisense
    user: agrisense
    region: singapore
    plan: free

services:
  - type: web
    name: agrisense-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATABASE_URL
        fromDatabase:
          name: agrisense-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: BDAPPS_APPLICATION_ID
        sync: false
      - key: BDAPPS_PASSWORD
        sync: false
      - key: BDAPPS_SMS_SOURCE_ADDRESS
        sync: false
      - key: BDAPPS_BASE_URL
        value: https://developer.bdapps.com
      - key: BDAPPS_API_VERSION
        value: "1.0"
      # Kindwise crop.health — app/tools/crop_health.py. Defaults to "" in
      # core/config.py, so leaving this unset degrades silently rather than
      # failing the deploy.
      - key: CROP_HEALTH_API_KEY
        sync: false
      # Web-search fallback for when the RAG knowledge base has no answer —
      # app/tools/web_search.py. Optional.
      - key: TAVILY_API_KEY
        sync: false
      # Static-outbound-IP proxy for BDApps' IP whitelist — see the note in
      # backend/.env.example. Leave blank to call BDApps directly.
      - key: FIXIE_URL
        sync: false

  - type: web
    name: agrisense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
